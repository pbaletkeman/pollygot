plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
}

group = 'week1'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'week1.application.MainApplication'
}

tasks.named('test') {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }

    reports {
        junitXml.required = true
        html.required = true
    }
}

// Static analysis (run with: gradle checkstyleMain checkstyleTest)
// Both tasks are wired into `gradle check` automatically.
checkstyle {
    configFile = file('config/checkstyle/checkstyle.xml')
    toolVersion = '10.21.1'
    ignoreFailures = false
    maxWarnings = 0
    showViolations = true
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

// Coverage report (run with: gradle jacocoTestReport) for the Week 1
// acceptance criterion "JUnit coverage greater than 70%"
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check') {
    dependsOn jacocoTestReport
}
